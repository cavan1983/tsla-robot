name: TRADE PRO V7 KO SMART

on:
  schedule:
    - cron: '0 * * * *'  # hər saat
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Cache data (beyinlər yalnız Actions yaddaşında)
        uses: actions/cache@v4
        with:
          path: data
          key: trade-data-v7-${{ github.run_id }}
          restore-keys: |
            trade-data-v7-
      
      - name: Python qur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Kitabxanalar
        run: |
          pip install -r requirements.txt
          
      - name: İşlə
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          python robot_github_V7_KO.py
