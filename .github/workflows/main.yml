name: TSLA Robot 7/24
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  run-robot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir yfinance requests pytz pandas numpy scikit-learn
          pip install --no-cache-dir tensorflow==2.15.0 || pip install --no-cache-dir tensorflow
        continue-on-error: false
      - name: Run Robot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          PYTHONWARNINGS: ignore
          TF_CPP_MIN_LOG_LEVEL: 3
          ABSL_LOGGING: 0
        run: |
          python robot_github_7-24.py || echo "Robot error oldu amma workflow davam edir"
